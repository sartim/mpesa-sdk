name: Sandbox OAuth smoke check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oauth-smoke-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install .
      - name: Request a sandbox OAuth token
        env:
          DARAJA_SANDBOX_CONSUMER_KEY: ${{ secrets.DARAJA_SANDBOX_CONSUMER_KEY }}
          DARAJA_SANDBOX_CONSUMER_SECRET: ${{ secrets.DARAJA_SANDBOX_CONSUMER_SECRET }}
        run: python scripts/sandbox_oauth_smoke.py
